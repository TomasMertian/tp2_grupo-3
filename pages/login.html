<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cine Aurora 📽️ - Login</title>
    <meta name="description" content="Cine Aurora - Login" />
    <link rel="icon" href="../assets/favicon/logo-cine.png" />
    <link rel="stylesheet" href="../css/login.css" />
  </head>

  <body>
    <header class="header-principal">
      <div class="header-logo">
        <h1>Cine Aurora</h1>
        <img src="../assets/favicon/logo-cine.png" alt="logo-cine-aurora" />
      </div>

      <div class="header-nav">
        <nav>
          <a href="../index.html">Inicio</a>
          <a href="./estrenos.html">Próximos estrenos</a>
          <a href="../index.html">Volver</a>
        </nav>
      </div>
    </header>

    <main class="contenedor-login">
      <form action="perfil.html" class="login-card">
        <h2 class="login-titulo">Acceso Clientes</h2>

        <div class="campo-formulario">
          <label>Email</label>
          <input type="email" placeholder="ejemplo@email.com" required />
        </div>

        <div class="campo-formulario">
          <label>Contraseña</label>
          <input type="password" placeholder="••••••••" required />
        </div>
        
        <button type="submit" class="btn btn-ver-mas">Ingresar</button>
        <p class="link-registro">¿No eres miembro? <a href="registro.html">Regístrate</a></p>
      </form>
    </main>

    <footer class="footer-index">
      <p>&copy; 2026 Cine Aurora - Todos los derechos reservados</p>
    </footer>
  </body>
</html>
