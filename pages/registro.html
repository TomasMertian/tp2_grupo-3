<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cine Aurora 📽️ - Registro</title>
    <meta name="description" content="Cine Aurora - Registro" />
    <link rel="icon" href="../assets/favicon/logo-cine.png" />
    <link rel="stylesheet" href="../css/style.css" />
  </head>

  <body>
    <header class="header">
      <div class="header-top">
        <h1 class="'logo">Cine Aurora</h1>
        <img src="../assets/favicon/logo-cine.png" alt="logo-cine-aurora" />
      </div>

      
        <nav class="nav">
          <a href="../index.html">Inicio</a>
          <a href="./estrenos.html">Próximos estrenos</a>
          <a href="../index.html">Volver</a>
        </nav>
    </header>

    <main class="registro">
      <div class="registro-card">
        <form action="login.html">
          <h2>Crear nueva cuenta</h2>
          <div class="form-group">
            <label>Nombre Completo</label>
            <input class="registro-input" type="text" required />
          </div>
          <div class="form-group">
            <label>Email</label>
            <input class="registro-input" type="email" required />
          </div>
          <div class="form-group">
            <label>Fecha de nacimiento</label>
            <input class="registro-input" type="date" required />
          </div>
          <div class="form-group">
            <label>Contraseña</label>
            <input class="registro-input" type="password" required />
          </div>

          <div class="form-group">
            <label>Confirmar contraseña</label>
            <input class="registro-input" type="password" required />
          </div>

          <hr />
          
          <section class="registro-extra">
            <div class="registro-extra-texto">
              <h3>Datos para ayudar al cine</h3>
              <p>Estos datos nos ayudan a mejorar tu experiencia.</p>
            </div>
            <div class="registro-extra-campos">
              <div class="form-group">
                <label>Elegí tu color favorito para las butacas</label>
                <input type="color" />
              </div>

              <div class="form-group">
                <label
                  >¿Cuántas entradas comprás en general? Min: 0 | Max: 10</label
                >
                <input type="range" min="0" max="10" />
              </div>

              <div class="form-group">
                <label>Seleccioná tu género favorito</label>
                <select>
                  <option>Acción</option>
                  <option>Drama</option>
                  <option>Ciencia ficción</option>
                  <option>Terror</option>
                  <option>Comedia</option>
                  <option>Romance</option>
                </select>
              </div>

              <div class="form-group">
                <label>Elegí tu snack favorito</label>

                <div class="radio-group">
                  <label><input type="radio" name="snack" /> Pochoclo dulce</label>
                  <label><input type="radio" name="snack" /> Pochoclo salado</label>
                  <label><input type="radio" name="snack" /> Chocolate</label>
                  <label><input type="radio" name="snack" /> Frutos secos</label>
                </div>
              </div>
          </div>

          <div class="registro-acciones">
            <button class="registro-boton" type="submit">Regístrate</button>
          </div>
        </form>
      </div>

      <footer class="footer">
        <p>&copy; 2026 Cine Aurora - Todos los derechos reservados</p>
      </footer>
    </main>
  </body>
</html>
