<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cine Aurora 📽️ - Registro</title>
    <meta name="description" content="Cine Aurora - Registro" />
    <link rel="icon" href="../assets/favicon/logo-cine.png" />
    <link rel="stylesheet" href="../css/style.css" />
  </head>

  <body>
    <header class="header">
      <div class="header-top">
        <h1 class="logo">Cine Aurora</h1>
        <img src="../assets/favicon/logo-cine.png" alt="logo-cine-aurora" />
      </div>

      
        <nav class="nav">
          <a href="../index.html">Inicio</a>
          <a href="./estrenos.html">Próximos estrenos</a>
          <a href="../index.html">Volver</a>
        </nav>
    </header>

    <main class="registro">
      <div class="registro-card">
        <form class="registro-form" action="login.html">
          <h2>Crear nueva cuenta</h2>
          <div class="form-group">
            <label for="nombre">Nombre Completo</label>
            <input id="nombre" name="nombre" class="registro-input" type="text" required />
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input id="email" name="email" class="registro-input" type="email" required />
          </div>
          <div class="form-group">
            <label for="fecha">Fecha de nacimiento</label>
            <input id="fecha" name="fecha" class="registro-input" type="date" required />
          </div>
          <div class="form-group">
            <label for="password">Contraseña</label>
            <input id="password" name="password" class="registro-input" type="password" required />
          </div>

          <div class="form-group">
            <label for="confirmar">Confirmar contraseña</label>
            <input id="confirmar" name="confirmar" class="registro-input" type="password" required />
          </div>

          <hr />
          
          <section class="registro-extra">
            <div class="registro-extra-texto">
              <h3>Datos para ayudar al cine</h3>
              <p>Estos datos nos ayudan a mejorar tu experiencia.</p>
            </div>
            <div class="registro-extra-campos">
              <div class="form-group">
                <label for="color">Elegí tu color favorito para las butacas</label>
                <input id="color" name="color" type="color" />
              </div>

              <div class="form-group">
                <label for="entradas"
                  >¿Cuántas entradas comprás en general? Min: 0 | Max: 10</label
                >
                <input id="entradas" name="entradas" type="range" min="0" max="10" />
              </div>

              <div class="form-group">
                <label for="genero">Seleccioná tu género favorito</label>
                <select id="genero" name="genero">
                  <option>Acción</option>
                  <option>Drama</option>
                  <option>Ciencia ficción</option>
                  <option>Terror</option>
                  <option>Comedia</option>
                  <option>Romance</option>
                </select>
              </div>

              <div class="form-group">
                <label>Elegí tu snack favorito</label>

                <div class="radio-group">
                  <label><input type="radio" name="snack" value="dulce"/> Pochoclo dulce</label>
                  <label><input type="radio" name="snack" value="salado"/> Pochoclo salado</label>
                  <label><input type="radio" name="snack" value="chocolate"/> Chocolate</label>
                  <label><input type="radio" name="snack" value="frutos-secos"/> Frutos secos</label>
                </div>
              </div>
          </div>
          </section>

          <div class="registro-acciones">
            <button class="registro-boton" type="submit">Regístrate</button>
          </div>
        </form>
      </div>

      <footer class="footer">
        <p>&copy; 2026 Cine Aurora - Todos los derechos reservados</p>
      </footer>
    </main>
  </body>
</html>
